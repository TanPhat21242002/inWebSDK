<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Hatch</title>
    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: none;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }
      .canvas-holder {
        flex-grow: 1;
        overflow: hidden;
      }

      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background-color: black;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <div class="canvas-holder">
      <canvas
        class="emscripten"
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      ></canvas>
    </div>

    <script src="./../_CommonFiles/notation.js"></script>
    <script type="text/javascript">
      var Module = {
        FS: {},
        arguments: [],
        preRun: [],
        postRun: [
          function () {
            // ------------------- Initialize ODA lib ----------------
            Module.canvas = document.querySelector("canvas");
            const {
              Services,
              OdDbBlockTableRecord,
              OdString,
              OdWrFileBuf,
              OdGePoint3d, OdGsDCRect,
              OdDbHatch, OdDbCircle,
              OdDbObjectIdArray
            } = Module;

            const services = new Services();
            services.initialize();
            let pDb = services.createDatabase();
            const modelSpaceId = pDb.getModelSpaceId()
            const obj = modelSpaceId.safeOpenObject(OpenMode.kForWrite, false)
            const pRecord = OdDbBlockTableRecord.cast(obj);
            obj.delete()
            var pHatch = OdDbHatch.createObject()
            pHatch.setDatabaseDefaults(pDb, true)
            var str = new OdString("SOLID")
            pHatch.setPattern(HatchPatternType.kPreDefined, str)
            
            var pCircle = OdDbCircle.createObject();
            pCircle.setRadius(10)
            var idArr = new OdDbObjectIdArray()
            idArr.push_back(pRecord.appendOdDbEntity(pCircle))
            pHatch.appendLoop2(HatchLoopType.kDefault, idArr, false)
            pRecord.appendOdDbEntity(pHatch)

            pHatch.delete()
            pCircle.delete()
            pRecord.delete()

            var cadCore = new Module.CadCore();
            cadCore.createDevice();
            cadCore.setDb(pDb);
            Module.canvas.height = Module.canvas.clientHeight;
            Module.canvas.width = Module.canvas.clientWidth;
            cadCore.Resize(Module.canvas.width, Module.canvas.height);
            cadCore.ZoomExtents();
            cadCore.Update();
            pDb.delete();
            services.uninitialize();
          },
        ],
      };
    </script>
    <script async type="text/javascript" src="/DrawingWeb.js"></script>
  </body>
</html>
