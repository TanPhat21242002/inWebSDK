<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>OdDbSolid</title>
    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: none;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }
      .canvas-holder {
        flex-grow: 1;
        overflow: hidden;
      }

      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background-color: black;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="emscripten_border">
        <button id="download">Download</button>
      </div>
    </div>
    <div class="canvas-holder">
      <canvas
        class="emscripten"
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      ></canvas>
    </div>

    <script src="/_CommonFiles/notation.js"></script>

    <script type="text/javascript" src="code.js"></script>
    
    <script
      async
      type="text/javascript"
      src="/DrawingWeb.js"
    ></script>
  </body>
</html>
